<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Teklif Karşılaştırma — Gavia CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
/* ============ SAYFAYA ÖZEL — Teklif Karşılaştırma (§16 Faz 2) ============
   KOLON YAPISI + best/sel VURGUSU crm-satinalma-form-detay.html'in .icmal-tbl bloğundan
   (satır 49-75) BİREBİR devralındı — yeniden yorumlanmadı, yalnız sınıf adları AYNEN
   kopyalandı ve interaktif SEÇİM aksiyonu eklendi (o sayfada seçim zaten YAPILMIŞ bir
   kararın salt-okunur özetiydi; burada ?form=014 gibi AÇIK süreçlerde gerçek "Bu Teklifi
   Seç" aksiyonu var). SAT-2026-018 verisi form-detay.html + icmal-cikti.html ile BİREBİR
   (9 kalem, 5 tedarikçi, Deta Demir Çelik seçili — kapalı/tarihi süreç, salt-okunur).
   SAT-2026-014 verisi crm-satinalma-teklifler.html ile BİREBİR (Ege/Trakya yanıtladı,
   3 tedarikçi bekliyor/vermedi) — AÇIK süreç, seçim CANLI. */
.tk-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tk-stat{flex:1;min-width:150px;padding:13px 15px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}
.tk-stat b{display:block;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.3}
.tk-stat span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tk-stat.acc{background:rgba(var(--acc-rgb),.08);border-color:rgba(var(--acc-rgb),.25)}
.tk-stat.acc b{color:var(--acc-ink)}

.icmal-wrap{overflow-x:auto;margin:0 0 4px;border:1px solid var(--line);border-radius:var(--r-md)}
table.icmal-tbl{width:100%;min-width:900px;border-collapse:collapse;font-size:12px}
.icmal-tbl th,.icmal-tbl td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.icmal-tbl th{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.icmal-tbl thead tr.sup-row th{border-bottom:1px solid var(--line);padding-bottom:6px;text-align:center}
.icmal-tbl thead tr.sub-row th{padding-top:5px;font-size:9px}
.icmal-tbl .col-kalem{text-align:left;min-width:210px;white-space:normal;vertical-align:middle}
.icmal-tbl th.col-kalem{background:var(--bg)}
.icmal-tbl th.sup-sel{background:rgba(var(--acc-rgb),.14);color:var(--acc-ink)}
.icmal-tbl td.sup-sel{background:rgba(var(--acc-rgb),.06)}
.icmal-tbl td.best{background:rgba(var(--acc-rgb),.12);color:var(--acc-ink);font-weight:800}
.icmal-tbl td.mut{color:var(--muted);text-align:center;font-weight:500;font-style:italic}
.icmal-tbl .kalem-ad{display:block;font-weight:600;color:var(--ink);white-space:normal;line-height:1.3}
.icmal-tbl .kalem-mik{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.icmal-tbl .win-name{display:block;font-weight:600;font-size:9.5px;color:var(--acc-deep);margin-top:1px}
.icmal-tbl tr.tot td{border-top:2px solid var(--line-2);border-bottom:none;font-weight:800;color:var(--ink);background:var(--bg)}
.icmal-tbl tr.tot td.best{background:rgba(var(--acc-rgb),.18)}
.icmal-tbl tr.tot td.sup-sel{background:rgba(var(--acc-rgb),.18);color:var(--acc-ink)}
.icmal-tbl .part-note{display:block;font-size:9.5px;font-weight:600;color:var(--muted);margin-top:2px}

/* ============ YENİ — canlı seçim aksiyonu (bu sayfaya özgü, .icmal-tbl'e ek) ============ */
.icmal-tbl th.sup-th{position:relative}
.sup-seç-btn{all:unset;display:block;margin:6px auto 0;font-family:inherit;font-size:9.5px;font-weight:800;
  color:var(--acc-ink);background:var(--paper);border:1px solid var(--acc-ink);border-radius:var(--r-pill);
  padding:3px 10px;cursor:pointer;transition:.15s var(--ease);white-space:nowrap}
.sup-seç-btn:hover{background:var(--acc-ink);color:#fff}
.sup-seç-btn.is-sel{background:var(--acc-ink);color:#fff;cursor:default}

.sup-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.sup-note-card{padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg)}
.sup-note-card.sel{border-color:rgba(var(--acc-rgb),.4);background:rgba(var(--acc-rgb),.06)}
.sup-note-card h5{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sup-note-card h5 i{color:var(--acc-ink);font-size:11px}
.sup-note-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:11.5px;line-height:1.4}
.sup-note-card dt{color:var(--muted);font-weight:700}
.sup-note-card dd{color:var(--ink-2)}

.tk-closed-banner{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:18px}
.tk-closed-banner i{color:var(--acc-ink)}
.tk-open-banner{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#7A5C06;background:var(--warn-tint);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:18px}
.tk-open-banner i{color:var(--warn)}

.tk-sonuc-card{display:none;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 20px;border-radius:var(--r-md);background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.3);margin-top:18px}
.tk-sonuc-card.show{display:flex}
.tk-sonuc-card b{font-size:14px;color:var(--ink)}
.tk-sonuc-card span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
</style>
</head>
<body data-sec="satinalma" data-screen="teklifler">
<div class="gv-app">
  <aside class="gv-rail" id="gvRail"></aside>
  <nav class="gv-menu" id="gvMenu"></nav>
  <div class="gv-divider" id="gvDivider" role="separator" aria-label="Menüyü daralt/genişlet"><span class="gv-grip"></span></div>
  <div class="gv-overlay" id="gvOverlay"></div>

  <header class="gv-top">
    <button class="gv-burger" id="gvBurger" aria-label="Menü"><i class="fa-solid fa-bars"></i></button>
    <div class="gv-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Ara"></div>
    <div class="gv-top-tools">
      <button class="gv-iconbtn" data-tip="Bildirimler" aria-label="Bildirimler"><i class="fa-regular fa-bell"></i><span class="gb-dot"></span></button>
      <div class="gv-me">
        <div class="me-ava" id="gvAva">·</div>
        <div class="me-id"><div class="me-name" id="gvName">—</div><div class="me-role" id="gvRole">—</div></div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <main class="gv-main">
    <div class="gv-crumb" style="display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:14px">
      <a href="crm-satinalma-teklifler.html" style="color:var(--acc-ink);font-weight:700">Tedarikçi Teklifleri</a>
      <i class="fa-solid fa-chevron-right" style="font-size:9px;color:var(--line-2)"></i>
      <span id="crumbNo">SAT-2026-018</span>
    </div>

    <div class="gv-page-head">
      <div>
        <div class="ph-eyebrow" id="phEyebrow">Vadi Konakları</div>
        <h1 id="phTitle">Teklif Karşılaştırma</h1>
        <div class="ph-sub" id="phSub">—</div>
      </div>
      <div class="ph-actions">
        <a class="btn btn-ghost btn-sm" id="btnIcmalCikti" href="crm-satinalma-icmal-cikti.html"><i class="fa-solid fa-print"></i> İcmal Çıktısı Al</a>
      </div>
    </div>

    <div id="bannerMount"></div>

    <div class="gv-card">
      <div class="gd-block">
        <div class="tk-summary" id="tkSummary"></div>
        <div class="icmal-wrap"><table class="icmal-tbl" id="icmalTbl"></table></div>
        <p class="teklif-note" style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px;display:flex;align-items:flex-start;gap:8px" id="teklifNote"></p>
        <div class="sup-notes" id="supNotes"></div>
        <div class="tk-sonuc-card" id="sonucCard">
          <div><b id="sonucBaslik">—</b><span id="sonucAlt">—</span></div>
          <a class="btn btn-acc btn-sm" id="btnSiparise" href="#"><i class="fa-solid fa-arrow-right"></i> Siparişe Dönüştür / Onaya Gönder</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  if(!window.GV) return;

  function tl(n){ return n.toLocaleString('tr-TR'); }

  /* ---- SAT-2026-018 — form-detay.html/icmal-cikti.html ile BİREBİR (kapalı süreç) ---- */
  var SUP_018 = [
    {key:'ege', no:1, ad:'Ege Hazır Beton'},
    {key:'trakya', no:2, ad:'Trakya Beton'},
    {key:'marmara', no:3, ad:'Marmara Yapı Market'},
    {key:'deta', no:4, ad:'Deta Demir Çelik', sel:true},
    {key:'nokta', no:5, ad:'Nokta Hırdavat'}
  ];
  var KALEM_018 = [
    {ad:'PPR boru ve fitting takımı (Ø20–32 mm)', mik:'1 takım', ege:[84600,17800], trakya:[91200,19600], marmara:[88400,18900], deta:[89500,21800], nokta:[93800,20400]},
    {ad:'Kolektör grubu (6 çıkışlı, pirinç)', mik:'4 adet', ege:[12600,2800], trakya:[14800,3200], marmara:[13900,3000], deta:[14200,3600], nokta:[15200,3400]},
    {ad:'Sirkülasyon pompası (Wilo tipi, 3 hız)', mik:'2 adet', ege:[24600,5200], trakya:[25400,5600], marmara:null, deta:[23400,5500], nokta:[21200,4600]},
    {ad:'Vana grubu (küresel vana + çek valf)', mik:'1 takım', ege:[33600,7200], trakya:[35900,7600], marmara:[30800,6400], deta:[36000,8600], nokta:[37200,8100]},
    {ad:'Boru izolasyonu (kauçuk köpük, 6 mm)', mik:'340 m', ege:[29800,9900], trakya:[31200,10400], marmara:[27600,9200], deta:[32900,10800], nokta:[33600,11100]},
    {ad:'Çelik konsol / askı takımı', mik:'220 adet', ege:[30800,9800], trakya:[33400,10600], marmara:[32200,10200], deta:[35600,11600], nokta:[34800,11000]},
    {ad:'Panel radyatör (600×1200 mm, çift sıra)', mik:'48 adet', ege:[248600,64800], trakya:[252400,66200], marmara:null, deta:[258000,67500], nokta:[236800,61400]},
    {ad:'Sayaç kutusu (daire kalorimetre)', mik:'34 adet', ege:[80600,19000], trakya:[82400,19600], marmara:[79800,18800], deta:[84600,20000], nokta:[76400,18200]},
    {ad:'Sarf malzeme paketi (teflon bant, conta, lehim)', mik:'1 paket', ege:[14800,2600], trakya:[15600,2800], marmara:[14200,2500], deta:[15900,2800], nokta:[13600,2400]}
  ];
  var NOT_018 = {
    ege:{not_:'Radyatör + sayaç kalemlerinde 6 hafta ek teslim istedi', termin:'8 hafta (tüm kalemler)', odeme:'45 gün vade'},
    trakya:{not_:'Tüm kalemlerde rakiplerin üzerinde fiyat', termin:'6 hafta', odeme:'Peşin %30 + 30 gün'},
    marmara:{not_:'Pompa ve radyatörde teklif vermedi (stoğu dışı)', termin:'4 hafta (7 kalem)', odeme:'30 gün vade'},
    deta:{not_:'Tek tedarikçiden tam paket; montaj koordinasyonu + 2 yıl garanti dahil', termin:'5 hafta (tüm kalemler)', odeme:'60 gün vade'},
    nokta:{not_:'En düşük birim fiyatlar; büyük hacimde stok garantisi sınırlı', termin:'7 hafta (stok gecikebilir)', odeme:'Peşin'}
  };

  /* ---- SAT-2026-014 — crm-satinalma-teklifler.html ile BİREBİR (açık süreç) ---- */
  var SUP_014 = [
    {key:'ege', no:1, ad:'Ege Hazır Beton'},
    {key:'trakya', no:2, ad:'Trakya Beton Santrali'},
    {key:'marmara', no:3, ad:'Marmara Yapı Market', vermedi:true},
    {key:'bogazici', no:4, ad:'Boğaziçi Yapı Market', bekliyor:true},
    {key:'anadolu', no:5, ad:'Anadolu Hırdavat', bekliyor:true}
  ];
  var KALEM_014 = [
    {ad:'Hazır beton C30', mik:'30 m³', ege:[142500,0], trakya:[158000,0]}
  ];
  var NOT_014 = {
    ege:{not_:'—', termin:'2 gün içinde teslim', odeme:'Belirtilmedi'},
    trakya:{not_:'—', termin:'3 gün içinde teslim', odeme:'Belirtilmedi'}
  };

  var FORMS = {
    '018':{ no:'SAT-2026-018', title:'Mekanik Tesisat Paketi — Teklif Karşılaştırma', santiye:'Vadi Konakları',
      sup:SUP_018, kalem:KALEM_018, notlar:NOT_018, closed:true, secili:'deta',
      not_:'Bu döküm Gavia CRM satın alma teklif karşılaştırmasını içerir. Seçili tedarikçi (Deta Demir Çelik) hücreleri koyu vurguludur; en iyi fiyat kolonu satır bazında en düşük teklifi gösterir.' },
    '014':{ no:'SAT-2026-014', title:'Hazır Beton C30 — Teklif Karşılaştırma', santiye:'Vadi Konakları',
      sup:SUP_014, kalem:KALEM_014, notlar:NOT_014, closed:false, secili:null,
      not_:'2 tedarikçi yanıtladı, 2 tedarikçi hâlâ bekleniyor. Bir teklifi seçmek diğer açık tekliflerin yanıtını beklemenizi engellemez.' }
  };

  var q = new URLSearchParams(location.search);
  var key = q.get('form');
  key = (key || '018').replace(/^SAT-2026-/i, '').replace(/^0*/, '').padStart(3, '0');
  if(!FORMS[key]) key = '018';
  var F = FORMS[key];
  var selKey = F.secili; // seçim state — açık süreçte kullanıcı değiştirebilir

  function renderTable(){
    document.getElementById('crumbNo').textContent = F.no;
    document.getElementById('phEyebrow').textContent = F.santiye + ' · Satın Alma Formu #' + F.no;
    document.getElementById('phTitle').textContent = F.title;
    document.title = F.no + ' — Teklif Karşılaştırma — Gavia CRM';
    document.getElementById('btnIcmalCikti').href = 'crm-satinalma-icmal-cikti.html' + (key === '018' ? '?form=SAT-2026-018' : '');
    document.getElementById('btnIcmalCikti').style.display = key === '018' ? '' : 'none';

    var yanitlayan = F.sup.filter(function(s){ return !s.bekliyor && !s.vermedi; }).length;
    document.getElementById('phSub').textContent = F.kalem.length + ' kalem · ' + F.sup.length + ' tedarikçi davet edildi · ' + yanitlayan + ' teklif alındı';

    document.getElementById('bannerMount').innerHTML = F.closed
      ? '<div class="tk-closed-banner"><i class="fa-solid fa-circle-check"></i> Bu süreç kapandı — <b>' + F.sup.filter(function(s){return s.key===selKey;})[0].ad + '</b> seçildi ve Genel Müdür onayına gönderildi. <a href="crm-satinalma-form-detay.html?form=' + key + '" style="margin-left:4px;font-weight:700;color:inherit;text-decoration:underline">Form detayına git</a></div>'
      : '<div class="tk-open-banner"><i class="fa-solid fa-triangle-exclamation"></i> Bu süreç hâlâ açık — henüz bir tedarikçi seçilmedi. Tabloda bir tedarikçinin başlığındaki "Seç" düğmesine basarak seçim yapabilirsiniz.</div>';

    // özet istatistikler
    var toplamlar = {}; F.sup.forEach(function(s){ toplamlar[s.key] = 0; });
    var bestTot = 0;
    F.kalem.forEach(function(K){
      var minKey = null, minVal = Infinity;
      F.sup.forEach(function(s){ var v = K[s.key]; if(v){ var t=v[0]+v[1]; if(t<minVal){minVal=t;minKey=s.key;} } });
      bestTot += minVal;
      F.sup.forEach(function(s){ var v = K[s.key]; if(v) toplamlar[s.key] += v[0]+v[1]; });
    });
    var seciliTot = selKey ? toplamlar[selKey] : null;
    document.getElementById('tkSummary').innerHTML =
      (seciliTot ? '<div class="tk-stat acc"><b>' + tl(seciliTot) + '</b><span>Genel toplam — seçili teklif</span></div>' : '<div class="tk-stat"><b>—</b><span>Henüz seçim yapılmadı</span></div>')
      + '<div class="tk-stat"><b>' + tl(bestTot) + '</b><span>En iyi fiyat kombinasyonu</span></div>'
      + '<div class="tk-stat"><b>' + (selKey ? F.sup.filter(function(s){return s.key===selKey;})[0].ad : F.sup.filter(function(s){return !s.bekliyor && !s.vermedi;}).length + ' teklif') + '</b><span>' + (selKey ? 'Seçili tedarikçi' : 'Karşılaştırılan teklif') + '</span></div>'
      + '<div class="tk-stat"><b>' + F.kalem.length + '</b><span>Kalem sayısı</span></div>';

    // thead
    var h = '<thead><tr class="sup-row"><th class="col-kalem" rowspan="2">Kalem</th>';
    F.sup.forEach(function(s){
      var isSel = s.key === selKey;
      h += '<th colspan="3" class="sup-th' + (isSel ? ' sup-sel' : '') + '">' + s.no + ' · ' + s.ad
        + (s.bekliyor ? '<div style="font-size:9px;font-weight:700;color:var(--muted);margin-top:4px">Bekleniyor</div>'
          : s.vermedi ? '<div style="font-size:9px;font-weight:700;color:var(--danger);margin-top:4px">Teklif vermedi</div>'
          : !F.closed ? '<button type="button" class="sup-seç-btn' + (isSel ? ' is-sel' : '') + '" data-select="' + s.key + '">' + (isSel ? '✓ Seçili' : 'Bu Teklifi Seç') + '</button>'
          : (isSel ? '<div style="font-size:9px;font-weight:800;color:var(--acc-ink);margin-top:4px">★ SEÇİLİ</div>' : ''))
        + '</th>';
    });
    h += '<th rowspan="2">En İyi Fiyat</th></tr><tr class="sub-row">';
    F.sup.forEach(function(s){ var c = s.key===selKey ? ' class="sup-sel"' : ''; h += '<th'+c+'>Malzeme</th><th'+c+'>İşçilik</th><th'+c+'>Toplam</th>'; });
    h += '</tr></thead>';

    // tbody
    var rows = '<tbody>';
    F.kalem.forEach(function(K){
      var minKey=null, minVal=Infinity;
      F.sup.forEach(function(s){ var v=K[s.key]; if(v){ var t=v[0]+v[1]; if(t<minVal){minVal=t;minKey=s.key;} } });
      rows += '<tr><td class="col-kalem"><span class="kalem-ad">' + K.ad + '</span><span class="kalem-mik">' + K.mik + '</span></td>';
      F.sup.forEach(function(s){
        var v = K[s.key];
        var selCls = s.key===selKey ? ' sup-sel' : '';
        var bestCls = s.key===minKey ? ' best' : '';
        if(!v) rows += '<td class="mut" colspan="3">— teklif yok</td>';
        else rows += '<td class="'+(selCls+bestCls).trim()+'">'+tl(v[0])+'</td><td class="'+(selCls+bestCls).trim()+'">'+tl(v[1])+'</td><td class="'+(selCls+bestCls).trim()+'">'+tl(v[0]+v[1])+'</td>';
      });
      var bv = K[minKey];
      rows += '<td class="best">₺' + tl(bv[0]+bv[1]) + '<span class="win-name">' + F.sup.filter(function(s){return s.key===minKey;})[0].ad + '</span></td></tr>';
    });
    var tot = {}; F.sup.forEach(function(s){ tot[s.key]=0; });
    F.kalem.forEach(function(K){ F.sup.forEach(function(s){ var v=K[s.key]; if(v) tot[s.key]+=v[0]+v[1]; }); });
    rows += '<tr class="tot"><td class="col-kalem">GENEL TOPLAM</td>';
    F.sup.forEach(function(s){ var selCls = s.key===selKey?' sup-sel':''; rows += '<td colspan="3" class="'+selCls.trim()+'">'+(tot[s.key] ? tl(tot[s.key]) : '—')+'</td>'; });
    rows += '<td class="best">' + tl(bestTot) + '</td></tr></tbody>';

    document.getElementById('icmalTbl').innerHTML = h + rows;
    document.getElementById('teklifNote').innerHTML = '<i class="fa-solid fa-circle-info" style="color:var(--acc-ink);margin-top:2px;flex:none"></i><span>' + F.not_ + '</span>';

    // tedarikçi not kartları — yalnız yanıtlayanlar
    var nh = '';
    F.sup.filter(function(s){ return !s.bekliyor && !s.vermedi; }).forEach(function(s){
      var N = F.notlar[s.key] || {};
      nh += '<div class="sup-note-card' + (s.key===selKey ? ' sel' : '') + '"><h5>' + (s.key===selKey ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-truck-field"></i>') + ' ' + s.ad + (s.key===selKey ? ' <span class="gtag mint">Seçili</span>' : '') + '</h5>'
        + '<dl><dt>Not</dt><dd>' + (N.not_ || '—') + '</dd><dt>Termin</dt><dd>' + (N.termin || '—') + '</dd><dt>Ödeme</dt><dd>' + (N.odeme || '—') + '</dd></dl></div>';
    });
    document.getElementById('supNotes').innerHTML = nh;

    // sonuç kartı — yalnız seçim varsa
    var sonucCard = document.getElementById('sonucCard');
    if(selKey){
      sonucCard.classList.add('show');
      var secilenAd = F.sup.filter(function(s){return s.key===selKey;})[0].ad;
      document.getElementById('sonucBaslik').textContent = secilenAd + ' seçildi — ' + tl(seciliTot) + '.';
      document.getElementById('sonucAlt').textContent = F.closed ? 'Bu form zaten Genel Müdür onayına gönderilmiş durumda.' : 'Devam etmek için siparişe dönüştürün veya onaya gönderin.';
      document.getElementById('btnSiparise').href = 'crm-satinalma-form-detay.html?form=' + key;
    } else {
      sonucCard.classList.remove('show');
    }
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-select]'); if(!btn || F.closed) return;
    var newKey = btn.getAttribute('data-select');
    if(newKey === selKey) return;
    gvConfirm({
      icon:'fa-scale-balanced',
      title:'Bu teklif seçilsin mi?',
      message: F.sup.filter(function(s){return s.key===newKey;})[0].ad + ' teklifi seçilecek. Diğer tedarikçilerin teklifleri karşılaştırma amacıyla kayıtta kalır.',
      ok:'Seç', cancel:'Vazgeç',
      onConfirm:function(){
        selKey = newKey;
        renderTable();
        gvToast(F.sup.filter(function(s){return s.key===newKey;})[0].ad + ' seçildi.', {icon:'fa-check'});
      }
    });
  });

  renderTable();
})();
</script>
</body>
</html>
